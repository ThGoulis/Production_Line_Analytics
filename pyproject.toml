[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-kpi"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.3"
]

[project.scripts]
kpi = "production_kpi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]